; =============================================================================
; av-club — photo / video *language* side of the pipeline
;
; Launch:
;   ~/models/presets/bin/av-club
;
; IMPORTANT: image/video generation does NOT run inside llama-server.
; These models write prompts, shot lists, captions, and critique frames.
; Diffusion / video models (Flux, Wan, etc.) run in ComfyUI — see README.
;
; You already have:
;   ~/models/flux2-klein-te/flux2-klein-9b-uncensored-f16.gguf  → ComfyUI (or compatible)
; =============================================================================

version = 1

[*]
jinja = 1
flash-attn = on
n-gpu-layers = 99
mmap = 1
temp = 0.7
top-p = 0.9
top-k = 20
min-p = 0.05

; Creative director: concepts, beat sheets, shot lists, style bibles.
[director]
hf = unsloth/Qwen3-14B-GGUF:Q4_K_M
ctx-size = 32768
temp = 0.85
top-p = 0.95

; Prompt engineer for Flux / SD / video nodes (positive/negative, camera, lighting).
[prompt-crafter]
hf = unsloth/Qwen3-8B-GGUF:Q4_K_M
ctx-size = 16384
temp = 0.7
top-p = 0.9

; Vision reviewer: critique stills / storyboard frames / UI in footage.
; Point mmproj at the matching mmproj GGUF from the HF repo after first fetch.
[frame-review]
hf = unsloth/Qwen3-VL-8B-Instruct-GGUF:Q4_K_M
ctx-size = 16384
temp = 0.3
top-p = 0.9

; Edit notes / assembly: rough cut descriptions, transitions, music cues.
[editor]
hf = unsloth/Qwen3-8B-GGUF:Q4_K_M
ctx-size = 32768
temp = 0.5
top-p = 0.9

; Captions, titles, YouTube/TikTok descriptions, alt text.
[captioner]
hf = ggml-org/gemma-3-4b-it-qat-GGUF:Q4_0
ctx-size = 16384
temp = 0.6
top-p = 0.95

; Fast batch tagging / filename suggestions / taxonomy.
[tagger]
hf = unsloth/Qwen3-1.7B-GGUF:Q4_K_M
ctx-size = 8192
temp = 0.2
top-p = 0.9
