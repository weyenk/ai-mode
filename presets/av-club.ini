; =============================================================================
; av-club — photo/video LANGUAGE side (ComfyUI renders pixels)
; See MODELS.md + agents/*.md
; models-max=3 (chief + jev + one specialist)
; =============================================================================

version = 1

[*]
jinja = 1
flash-attn = on
n-gpu-layers = 99
mmap = 1
top-k = 20
min-p = 0
presence-penalty = 1.5

; --- Orchestration -----------------------------------------------------------

; Chief of staff: creative lead talking to the human (same stack as director).
[chief]
hf = unsloth/Qwen3-14B-GGUF:Q4_K_M
ctx-size = 32768
temp = 0.85
top-p = 0.95

; Jev decision model — pick prompt-crafter / frame-review / editor / …
[jev]
hf = ggml-org/Kev-4B-GGUF:Q4_K_M
ctx-size = 16384

; Concepts, beat sheets, shot lists, style bibles.
[director]
hf = unsloth/Qwen3-14B-GGUF:Q4_K_M
ctx-size = 32768
temp = 0.85
top-p = 0.95

; Flux / SD prompt enhancer (fine-tuned), not a generic chat model.
[prompt-crafter]
hf = mradermacher/Qwen3-1.7B-Flux-Prompt-GGUF:Q4_K_M
ctx-size = 8192
temp = 0.7
top-p = 0.9
presence-penalty = 0.5

; Still / storyboard critique + OCR (mmproj auto from HF repo).
[frame-review]
hf = unsloth/Qwen3-VL-8B-Instruct-GGUF:Q4_K_M
ctx-size = 16384
temp = 0.3
top-p = 0.8
presence-penalty = 0.5

; Rough-cut notes, transitions, music cues.
[editor]
hf = unsloth/Qwen3-8B-GGUF:Q4_K_M
ctx-size = 32768
temp = 0.5
top-p = 0.8

; Titles, descriptions, alt text, social copy.
[captioner]
hf = unsloth/gemma-3-27b-it-GGUF:Q4_K_M
ctx-size = 32768
temp = 0.6
top-p = 0.9
presence-penalty = 0.5

; Batch tags / filenames / taxonomy.
[tagger]
hf = unsloth/Qwen3-1.7B-GGUF:Q4_K_M
ctx-size = 8192
temp = 0.2
top-p = 0.8
presence-penalty = 0
