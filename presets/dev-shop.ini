; =============================================================================
; dev-shop — development studio (see MODELS.md + agents/*.md)
; Mac Studio M5 Max / 128GB — models-max=3 (chief + jev + one specialist)
; =============================================================================

version = 1

[*]
jinja = 1
flash-attn = on
n-gpu-layers = 99
load-mode = mmap
top-k = 20
min-p = 0
presence-penalty = 1.5

; --- Orchestration -----------------------------------------------------------

; Chief of staff: talks to the human, clarifies, summarizes, presents results.
