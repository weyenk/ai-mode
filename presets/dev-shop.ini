; =============================================================================
; dev-shop — local development studio (llama-server router preset)
; Mac Studio M5 Max / 128GB: keep --models-max 2 (coder + one specialist)
;
; Launch:
;   ~/models/presets/bin/dev-shop
;
; Client "model" field must match the [section] name.
; =============================================================================

version = 1

[*]
jinja = 1
flash-attn = on
n-gpu-layers = 99
mmap = 1
temp = 0.7
top-p = 0.9
top-k = 20
min-p = 0.05

; -----------------------------------------------------------------------------
; Heavy hitters
; -----------------------------------------------------------------------------

; Primary coding agent (already on disk). Use for Qwen Code / implementation.
[coder]
model = /Users/noahkruswicki/models/qwen3-coder-next-ud-q8/UD-Q8_K_XL/Qwen3-Coder-Next-UD-Q8_K_XL-00001-of-00003.gguf
ctx-size = 65536
temp = 0.7
top-p = 0.9
min-p = 0.05

; General chat / brainstorming / non-code pairing (efficient MoE).
[chat]
hf = unsloth/Qwen3-30B-A3B-GGUF:Q4_K_M
ctx-size = 32768
