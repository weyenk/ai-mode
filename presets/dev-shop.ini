; =============================================================================
; dev-shop — development studio (see MODELS.md + agents/*.md)
; Mac Studio M5 Max / 128GB — models-max=5; warm = chief,jev,architect,coder,fast (~98 GiB)
; =============================================================================

version = 1

[*]
jinja = 1
flash-attn = on
n-gpu-layers = 99
load-mode = mmap
top-k = 20
min-p = 0
presence-penalty = 1.5

; --- Orchestration -----------------------------------------------------------

; Chief of staff: talks to the human, clarifies, summarizes, presents results.
; Sole user-facing POC — routes via jev; delegates planning/large reads to architect.
; 128k ctx so chief can absorb brainstorming / large pastes without "32k exceeded".
; KV @131072 (q4_0 K/V) ≈ 5 GiB; +8.4 GiB weights ≈ 13.4 GiB resident. Still Qwen3-14B
; (official GGUF, fast decode for a conversational router). See MODELS.md for the
; memory table + 30B-A3B upgrade alternative, and the iogpu.wired_limit_mb note.
[chief]
hf = Qwen/Qwen3-14B-GGUF:Q4_K_M
ctx-size = 131072
cache-type-k = q4_0
cache-type-v = q4_0
temp = 0.7
top-p = 0.8
chat-template-kwargs = {"enable_thinking": false}

; Jev decision model (System One /v1/systemone) — routes to a specialist.
; Not a chat model. Use POST /v1/systemone with closed-set role options.
[jev]
hf = ggml-org/Kev-4B-GGUF:Q4_K_M
ctx-size = 16384

; Cheap instruct chat: permission classifiers, structured JSON, quick side-queries.
; Internal / tooling (Qwen Auto-mode) — not for coding, planning, or human-facing work.
[fast]
hf = Qwen/Qwen3-4B-GGUF:Q4_K_M
ctx-size = 16384
temp = 0.7
top-p = 0.8
chat-template-kwargs = {"enable_thinking": false}

; --- Heavy hitters -----------------------------------------------------------

; Agentic coding executor. Runs plans from architect + specs from product.
; Native ctx 262k train; 65536 fits five-slot warm with architect @262k (see MODELS.md).
; q8_0 K/V: mild KV cut vs f16, better than q4 for code fidelity.
[coder]
hf = lmstudio-community/Qwen3-Coder-30B-A3B-Instruct-GGUF:Q4_K_M
; fidelity option (Q8 weights, 32.5 GB): ggml-org/Qwen3-Coder-30B-A3B-Instruct-Q8_0-GGUF
ctx-size = 65536
cache-type-k = q8_0
cache-type-v = q8_0
temp = 0.7
top-p = 0.8

; Heavy coder for rare under-specified / large jobs (local 80 GB UD-Q8).
[coder-xl]
model = /Users/noahkruswicki/models/qwen3-coder-next-ud-q8/UD-Q8_K_XL/Qwen3-Coder-Next-UD-Q8_K_XL-00001-of-00003.gguf
ctx-size = 131072
temp = 0.7
top-p = 0.8

; --- Specialists -------------------------------------------------------------

; PRDs, stories, prioritization (guided by agents/product.md).
[product]
hf = Qwen/Qwen3-14B-GGUF:Q4_K_M
ctx-size = 65536
temp = 0.5
top-p = 0.8

; Spike / competitive research with thinking model.
[research]
hf = unsloth/Qwen3-30B-A3B-Thinking-2507-GGUF:Q4_K_M
ctx-size = 65536
temp = 0.6
top-p = 0.95

; README / changelog / release prose.
[docs]
hf = unsloth/gemma-3-27b-it-GGUF:Q4_K_M
ctx-size = 65536
temp = 0.6
top-p = 0.9
presence-penalty = 0.5

; Test plans, edge cases, repro steps (code-aware).
[qa]
hf = unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF:Q4_K_M
ctx-size = 65536
temp = 0.3
top-p = 0.8

; Threat modeling / secure design review (security-tuned MoE).
[security]
hf = deer-sec/CyberStag-Security-26B-A4B-V1-Q4_K_M-GGUF
ctx-size = 65536
temp = 0.2
top-p = 0.85
presence-penalty = 0.5

; UI/frontend specialist (VL). mmproj auto-fetched from same HF repo.
; For screenshots, user message should include: Critique this UI design.
[design]
hf = stefans71/frontend-design-expert-8b:Q4_K_M
ctx-size = 16384
temp = 0.4
top-p = 0.9
presence-penalty = 0
chat-template-kwargs = {"enable_thinking": false}

; Alias role for product/UX flows — same weights as design, different agent md.
[ux]
hf = stefans71/frontend-design-expert-8b:Q4_K_M
ctx-size = 16384
temp = 0.4
top-p = 0.9
presence-penalty = 0
chat-template-kwargs = {"enable_thinking": false}

; Architecture + PLANNING owner. Thinking model, native 256k context.
; Writes plans/ADRs that product specs feed into and coder executes.
[architect]
hf = bartowski/Qwen_Qwen3-30B-A3B-Thinking-2507-GGUF:Q4_K_M
; official-only alternative (dense, YaRN beyond 32k): Qwen/Qwen3-32B-GGUF:Q4_K_M @ ctx 65536
ctx-size = 262144
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0
; (thinking enabled by default for this model — do NOT set enable_thinking=false)
