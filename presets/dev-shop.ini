; =============================================================================
; dev-shop — development studio (see MODELS.md catalog + agents/*.md; memory notes in .local/MODELS-notes.md)
; Mac Studio M5 Max / 128GB — models-max=5; warm = chief,jev,architect,coder,fast
; =============================================================================

version = 1

[*]
jinja = 1
flash-attn = on
n-gpu-layers = 99
load-mode = mmap
top-k = 20
min-p = 0
presence-penalty = 1.5

; --- Orchestration -----------------------------------------------------------

; Chief of staff: talks to the human, clarifies, summarizes, presents results.
; Sole user-facing POC — routes via jev; delegates planning/large reads to architect.
; Qwen3-30B-A3B-Instruct-2507: native 262k, non-thinking only (no chat-template-kwargs needed).
; Qwen3-14B was capped at its 40960 trained ctx by llama-server, so 131072 never applied.
; TEST SWAP — est. ~18.6 GiB weights + ~3.6 GiB KV @131072 (q4_0) ≈ 22 GiB resident; verify.
; See .local/MODELS-notes.md.
[chief]
hf = lmstudio-community/Qwen3-30B-A3B-Instruct-2507-GGUF:Q4_K_M
ctx-size = 131072
cache-type-k = q4_0
cache-type-v = q4_0
temp = 0.7
top-p = 0.8

; Jev decision model (System One /v1/systemone) — routes to a specialist.
; Not a chat model. Use POST /v1/systemone with closed-set role options.
[jev]
hf = ggml-org/Kev-4B-GGUF:Q4_K_M
ctx-size = 16384

; Cheap instruct chat: permission classifiers, structured JSON, quick side-queries.
; Internal / tooling (Qwen Auto-mode) — not for coding, planning, or human-facing work.
[fast]
hf = Qwen/Qwen3-4B-GGUF:Q4_K_M
ctx-size = 16384
temp = 0.7
top-p = 0.8
chat-template-kwargs = {"enable_thinking": false}

; --- Heavy hitters -----------------------------------------------------------

; Agentic coding executor. Runs plans from architect + specs from product.
; Devstral Small 2 (Mistral, 24B dense, native 256k): deliberately NOT Qwen so coder and
; architect (Qwen3 Thinking) are adversarial — different lab, different training/blind spots.
; Needs llama.cpp newer than the 2025-12-13 chat-template fix. Text only (no vision in llama.cpp).
; q8_0 K/V: mild KV cut vs f16, better than q4 for code fidelity.
[coder]
; Qwen3.8-27B (dense, Apache-2.0, native 262k). Chosen from LiveBench agentic coding (61.4, best open model that
; fits) and Artificial Analysis. Thinking is ON by default; sampling below is Qwen's thinking-mode recommendation.
; ctx 131072 (was 65536): thinking alone ran up to ~30k tokens in the bake-off; measured cost +2.4 GiB wired (65k 3.2 -> 131k 5.6).
hf = ggml-org/Qwen3.8-27B-GGUF:Q4_K_M
ctx-size = 131072
cache-type-k = q8_0
cache-type-v = q8_0
temp = 1.0
top-k = 20
min-p = 0
top-p = 0.95
repeat-penalty = 1.0
presence-penalty = 0
; Cap thinking so a stuck deliberation cannot burn the whole window (Qwen3.8 spent 15+ min with no answer on 2 specs in the bake-off).
reasoning-budget = 16384
reasoning-budget-message = I have enough information, so I will answer now.
; --- Devstral Small 2 (previous) ---
; hf = lmstudio-community/Devstral-Small-2-24B-Instruct-2512-GGUF:Q4_K_M
; temp = 0.15 ; top-k = 0 ; min-p = 0.01 ; top-p = 1.0 ; repeat-penalty = 1.05 ; presence-penalty = 0

; Heavy coder for rare under-specified / large jobs (local 80 GB UD-Q8).
[coder-xl]
model = /Users/noahkruswicki/models/qwen3-coder-next-ud-q8/UD-Q8_K_XL/Qwen3-Coder-Next-UD-Q8_K_XL-00001-of-00003.gguf
ctx-size = 131072
temp = 0.7
top-p = 0.8

; --- Specialists -------------------------------------------------------------

; PRDs, stories, prioritization (guided by agents/product.md).
[product]
hf = Qwen/Qwen3-14B-GGUF:Q4_K_M
ctx-size = 65536
temp = 0.5
top-p = 0.8

; Spike / competitive research with thinking model.
[research]
hf = unsloth/Qwen3-30B-A3B-Thinking-2507-GGUF:Q4_K_M
ctx-size = 65536
temp = 0.6
top-p = 0.95

; README / changelog / release prose.
[docs]
hf = unsloth/gemma-3-27b-it-GGUF:Q4_K_M
ctx-size = 65536
temp = 0.6
top-p = 0.9
presence-penalty = 0.5

; Test plans, edge cases, repro steps (code-aware).
[qa]
; Qwen3.8-27B on the SAME GGUF as coder (weights shared via mmap, ~+1-2 GiB). Strongest QA author in the bake-off: tests written
; from requirements + qa/guidelines caught 11/11 mutants after one repair round and flagged 13/13 bad task-1 implementations
; with no false alarms (Gemma 4: 3/11, Laguna: 9-11/11 but with false alarms, Kimi-Linear: never compiled).
; qa works from requirements, not the architect's plan. reasoning_effort=medium keeps it faster than the xhigh default.
hf = ggml-org/Qwen3.8-27B-GGUF:Q4_K_M
ctx-size = 65536
cache-type-k = q8_0
cache-type-v = q8_0
chat-template-kwargs = {"reasoning_effort": "medium"}
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0
presence-penalty = 0

; Threat modeling / secure design review (security-tuned MoE).
[security]
hf = deer-sec/CyberStag-Security-26B-A4B-V1-Q4_K_M-GGUF
ctx-size = 65536
temp = 0.2
top-p = 0.85
presence-penalty = 0.5

; UI/frontend specialist (VL). mmproj auto-fetched from same HF repo.
; For screenshots, user message should include: Critique this UI design.
[design]
hf = stefans71/frontend-design-expert-8b:Q4_K_M
ctx-size = 16384
temp = 0.4
top-p = 0.9
presence-penalty = 0
chat-template-kwargs = {"enable_thinking": false}

; Alias role for product/UX flows — same weights as design, different agent md.
[ux]
hf = stefans71/frontend-design-expert-8b:Q4_K_M
ctx-size = 16384
temp = 0.4
top-p = 0.9
presence-penalty = 0
chat-template-kwargs = {"enable_thinking": false}

; Architecture + PLANNING owner. Thinking model, native 256k context.
; Writes plans/ADRs that product specs feed into and coder executes.
[architect]
; Gemma 4 26B-A4B (Google DeepMind, MoE ~3.8B active, Apache-2.0, 256k ctx, configurable thinking). Best architect in the
; 2026-10-09 end-to-end bake-off: its specs let the Qwen3.8 coder reach 6/6 fully-correct after the QA loop (Qwen3.8 as its own
; architect: 0.50; Laguna-S-2.1: 0.70; Kimi-Linear: 0.53). ~20 GiB resident at ctx 262144 + q8_0 KV. Non-Qwen vs the coder.
; Details: .local/BAKEOFF-notes.md
hf = lmstudio-community/gemma-4-26B-A4B-it-GGUF:Q4_K_M
ctx-size = 262144
cache-type-k = q8_0
cache-type-v = q8_0
chat-template-kwargs = {"enable_thinking": true}
; Cap thinking: on 128k-246k prompts uncapped thinking sometimes never finished (16k tokens, empty answer); with a 4096 cap it
; finished and answered correctly. 8192 leaves room for spec writing. (2026-10-09 long-context test)
reasoning-budget = 8192
reasoning-budget-message = I have enough information, so I will answer now.
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0
presence-penalty = 0
