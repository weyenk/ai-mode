; =============================================================================
; learning-center — research → notes → podcast script (TTS is external)
; See MODELS.md + agents/*.md
; models-max=3 (chief + jev + one specialist)
; =============================================================================

version = 1

[*]
jinja = 1
flash-attn = on
n-gpu-layers = 99
load-mode = mmap
top-k = 20
min-p = 0
presence-penalty = 1.5

; --- Orchestration -----------------------------------------------------------

; Chief of staff: user-facing synthesis / tutoring conversation.
[chief]
hf = unsloth/Qwen3-14B-GGUF:Q4_K_M
ctx-size = 32768
temp = 0.7
top-p = 0.8

; Jev decision model — pick research-deep / synthesizer / podcast-host / …
[jev]
hf = ggml-org/Kev-4B-GGUF:Q4_K_M
ctx-size = 16384

; Deep multi-step reasoning (R1 distill).
[research-deep]
hf = unsloth/DeepSeek-R1-Distill-Qwen-32B-GGUF:Q4_K_M
ctx-size = 65536
temp = 0.6
top-p = 0.95

; Alternate: Qwen3 thinking MoE (newer stack).
[research-qwen]
hf = unsloth/Qwen3-30B-A3B-Thinking-2507-GGUF:Q4_K_M
ctx-size = 40960
temp = 0.6
top-p = 0.95

; Research dump → outline, flashcards, citation list.
[synthesizer]
hf = unsloth/Qwen3-14B-GGUF:Q4_K_M
ctx-size = 32768
temp = 0.5
top-p = 0.8

; Host + guest dialogue script (JSON turns). Higher creativity.
[podcast-host]
hf = unsloth/Qwen3-14B-GGUF:Q4_K_M
ctx-size = 32768
temp = 0.9
top-p = 0.95
top-k = 40
presence-penalty = 1.2

; Chapter titles, show notes, SEO blurbs from a transcript/script.
