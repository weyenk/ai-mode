hf = unsloth/Qwen3-4B-GGUF:Q4_K_M
ctx-size = 16384
temp = 0.5
top-p = 0.8

; Socratic tutor over synthesized notes.
[tutor]
hf = unsloth/Qwen3-8B-GGUF:Q4_K_M
ctx-size = 32768
temp = 0.6
top-p = 0.8
