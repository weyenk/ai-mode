; =============================================================================
; learning-center — research → teach → podcast pipeline
;
; Launch:
;   ~/models/presets/bin/learning-center
;
; LLM roles only live here. Voice synthesis is a separate process (see README).
; Suggested flow:
;   1) research-deep  → long-form findings + sources
;   2) synthesizer    → structured outline / study guide
;   3) podcast-host   → conversational multi-voice script
;   4) TTS tool       → audio (Kokoro / Chatterbox / mlx-audio — not llama-server)
; =============================================================================

version = 1

[*]
jinja = 1
flash-attn = on
n-gpu-layers = 99
mmap = 1
temp = 0.7
top-p = 0.9
top-k = 20
min-p = 0.05

; Deep research / reasoning workhorse. Prefer long ctx; one model at a time.
[research-deep]
hf = unsloth/DeepSeek-R1-Distill-Qwen-32B-GGUF:Q4_K_M
ctx-size = 65536
temp = 0.6
top-p = 0.95
top-k = 40

; Alternate deep thinker (Qwen3 native). Swap if you prefer Qwen over R1-distill.
[research-qwen]
hf = unsloth/Qwen3-32B-GGUF:Q4_K_M
ctx-size = 65536
temp = 0.6
top-p = 0.95

; Turns research dumps into outlines, study notes, flashcards, citations list.
[synthesizer]
hf = unsloth/Qwen3-14B-GGUF:Q4_K_M
ctx-size = 32768
temp = 0.5
top-p = 0.9

; Podcast / dialogue scriptwriter (host + guest turns, cold open, chapters).
[podcast-host]
hf = unsloth/Qwen3-14B-GGUF:Q4_K_M
ctx-size = 32768
temp = 0.9
top-p = 0.95
top-k = 40

; Fast chapter titles, show notes, SEO blurbs, timestamps from a transcript.
[show-notes]
hf = unsloth/Qwen3-4B-GGUF:Q4_K_M
ctx-size = 16384
temp = 0.5
top-p = 0.9

; Quiz / Socratic tutor over the synthesized notes.
[tutor]
hf = unsloth/Qwen3-8B-GGUF:Q4_K_M
ctx-size = 32768
temp = 0.6
top-p = 0.9
